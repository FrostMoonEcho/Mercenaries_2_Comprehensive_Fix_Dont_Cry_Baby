  "[Fix] Disable Aim Assist":
    Games:
      "Mercenaries 2: World in Flames":
        BLES00323: [ 01.03 ]
    Author: "FrostMoonEcho"
    Patch Version: 1.1
    Group: ""
    Notes: |
      Something that makes no struggle for you anymore
    Patch:
      # Common Human-camera correction solver, after every target/mode branch.
      # Clear the final horizontal/vertical correction inputs and preserve the
      # overwritten stack store. Manual stick input is handled outside this pass.
      - [ calloc, 0x006091F8, 4 ]
      - [ be32, 0x00000000, 0xEC842028 ] # fsubs f4,f4,f4 (effective correction = 0)
      - [ be32, 0x00000000, 0xECA52828 ] # fsubs f5,f5,f5 (effective correction = 0)
      - [ be32, 0x00000000, 0xECC63028 ] # fsubs f6,f6,f6 (effective correction = 0)
      - [ be32, 0x00000000, 0xD0A10098 ] # stfs  f5,0x98(r1) (original instruction)

      # Final Human-camera result: discard any correction still returned by the
      # target solver (including HVT priority) and return manual input f31.
      - [ be32, 0x00609258, 0xFC20F890 ] # fmr f1,f31 (was fadds f1,f31,f1)

      # Do not run the target tracker after preparing its arguments. Version 1.0
      # already ignored its numeric return at 0x00609258; this additionally stops
      # cached target-state side effects that can retain civilian aim friction.
      # The manual stick/smoothing path is earlier and is not bypassed here.
      - [ be32, 0x00609248, 0x60000000 ] # nop (was bl 0x005F4020)

      # PgCameraStateTurret update: the stack outputs already contain manual
      # yaw/pitch. Skip the only helper call that acquires a target and bends
      # that pair toward it before it is accumulated into the turret angles.
      - [ be32, 0x00614B08, 0x60000000 ] # nop (was bl 0x00614178)

  "[Fix] Corpses don't disappear immediately":
    Games:
      "Mercenaries 2: World in Flames":
        BLES00323: [ 01.03 ]
    Author: "FrostMoonEcho"
    Patch Version: 0.9
    Group: ""
    Notes: |
      A separate fixed array holds at most 16 ordinary Human cleanup IDs. Their
      final cleanup is deferred for 30.0 gameplay seconds using the native
      frame delta; a seventeenth simultaneous request stays game-managed.
      Mission scripts or world streaming can still force-remove an entity.
    Patch:
      # Sixteen {Human ID, seconds remaining} records, followed by an
      # initialization marker, frame-update scratch, and one-shot guard ID.
      - [ alloc, 0x0F000003, 0x00000100 ] # RW page at 0x0f000000

      # Exact normal Human cleanup request. The HVT/script-protection and Human
      # type tests are upstream at 0x003600FC; overflow remains native.
      - [ calloc, 0x00360140, 52 ]
      - [ be32, 0x00000000, 0x3D800F00 ] # lis r12,0x0f00 (queue base)
      - [ be32, 0x00000000, 0x800C0080 ] # lwz r0,0x80(r12) (initialization marker)
      - [ be32, 0x00000000, 0x3D20C0DE ] # lis r9,0xc0de
      - [ be32, 0x00000000, 0x6129001B ] # ori r9,r9,0x001b
      - [ be32, 0x00000000, 0x7F804800 ] # cmpw cr7,r0,r9
      - [ be32, 0x00000000, 0x419E0034 ] # beq cr7,initialized
      - [ be32, 0x00000000, 0x38000000 ] # li r0,0
      - [ be32, 0x00000000, 0x39600010 ] # li r11,16
      - [ be32, 0x00000000, 0x7D6903A6 ] # mtctr r11
      - [ be32, 0x00000000, 0x7D8A6378 ] # mr r10,r12
      - [ be32, 0x00000000, 0x900A0000 ] # stw r0,0(r10)
      - [ be32, 0x00000000, 0x900A0004 ] # stw r0,4(r10)
      - [ be32, 0x00000000, 0x394A0008 ] # addi r10,r10,8
      - [ be32, 0x00000000, 0x4200FFF4 ] # bdnz clear
      - [ be32, 0x00000000, 0x900C0084 ] # stw r0,0x84(r12) (clear elapsed scratch)
      - [ be32, 0x00000000, 0x900C0088 ] # stw r0,0x88(r12) (clear loop scratch)
      - [ be32, 0x00000000, 0x900C008C ] # stw r0,0x8c(r12) (clear one-shot guard)
      - [ be32, 0x00000000, 0x912C0080 ] # stw r9,0x80(r12)
      - [ be32, 0x00000000, 0x39600000 ] # li r11,0
      - [ be32, 0x00000000, 0x556A1838 ] # slwi r10,r11,3
      - [ be32, 0x00000000, 0x7D4A6214 ] # add r10,r10,r12
      - [ be32, 0x00000000, 0x800A0000 ] # lwz r0,0(r10)
      - [ be32, 0x00000000, 0x7F80E800 ] # cmpw cr7,r0,r29 (candidate Human ID)
      - [ be32, 0x00000000, 0x419E0064 ] # beq cr7,return_hook (already delayed)
      - [ be32, 0x00000000, 0x2F800000 ] # cmpwi cr7,r0,0
      - [ be32, 0x00000000, 0x419E0014 ] # beq cr7,insert
