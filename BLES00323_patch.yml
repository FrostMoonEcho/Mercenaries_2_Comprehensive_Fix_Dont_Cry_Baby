  "[Fix] Civilians get-up-then-die sequence disabled":
    Games:
      "Mercenaries 2: World in Flames":
        BLES00323: [ 01.03 ]
    Author: "FrostMoonEcho"
    Patch Version: 0.4
    Group: ""
    Notes: |
      Fixes a bug where NPC gets up after death and then falls dead again
    Patch:
      # Private writable state: +0 submitted count; +4 circular replacement
      # index; +0x10..+0x8f 16 pairs of FakeDead and owning-pedestrian pointers.
      # RPCS3 selects protection from the full encoded address modulo 3.
      # 0x0f020001 % 3 == 0 selects writable/executable allocation while the
      # page-aligned mapped address remains exactly 0x0f020000.
      - [ alloc, 0x0F020001, 0x00000100 ]

      # Human FadeOut +4, after the original 0xc0-byte frame is allocated but
      # before its incoming LR is saved. Resolve the departing Human and clear
      # every submitted pair owned by that object. The final mflr is the exact
      # original instruction at this hook address.
      - [ calloc, 0x0035B5A4, 30 ]
      - [ be32, 0x00000000, 0x7C0802A6 ] # capture incoming LR
      - [ be32, 0x00000000, 0xF80100D0 ] # save LR in original frame
      - [ be32, 0x00000000, 0x90610060 ] # save departing Human ID
      - [ be32, 0x00000000, 0x3D800F02 ] # private submitted table
      - [ be32, 0x00000000, 0x816C0000 ] # submitted-entry count
      - [ be32, 0x00000000, 0x2F8B0000 ]
      - [ be32, 0x00000000, 0x419E0050 ] # no entries: restore original mflr
      - [ be32, 0x00000000, 0x3D800010 ]
      - [ be32, 0x00000000, 0x618CEA90 ] # engine GUID-to-object lookup
      - [ be32, 0x00000000, 0x7D8903A6 ] # mtctr r12
      - [ be32, 0x00000000, 0x4E800421 ] # bctrl
      - [ be32, 0x00000000, 0x2F830000 ]
      - [ be32, 0x00000000, 0x419E0038 ] # already unregistered: leave entries
      - [ be32, 0x00000000, 0x7C6A1B78 ] # resolved departing owner
      - [ be32, 0x00000000, 0x3D800F02 ]
      - [ be32, 0x00000000, 0x816C0000 ] # reload submitted-entry count
