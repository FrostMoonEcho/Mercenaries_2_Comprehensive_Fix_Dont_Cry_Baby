      - [ be32, 0x00000000, 0x3D800F00 ] # lis r12,0x0f00
      - [ be32, 0x00000000, 0x38000000 ] # li r0,0
      - [ be32, 0x00000000, 0x900C008C ] # stw r0,0x8c(r12) (clear suppression fallback)
