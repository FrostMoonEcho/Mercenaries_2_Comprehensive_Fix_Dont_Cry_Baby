      - [ be32, 0x00000000, 0x7D8903A6 ] # mtctr r12
      - [ be32, 0x00000000, 0x4E800421 ] # bctrl (original normal cleanup registration)
      - [ be32, 0x00000000, 0x3C000035 ] # lis r0,0x0035
      - [ be32, 0x00000000, 0x6000D92C ] # ori r0,r0,0xd92c
      - [ be32, 0x00000000, 0x7C0803A6 ] # mtlr r0 (emulate original BL return address)
      - [ be32, 0x00000000, 0x60000000 ] # nop (calloc return pad)

      # Preserve the native HVT updater, then advance only the separate normal
