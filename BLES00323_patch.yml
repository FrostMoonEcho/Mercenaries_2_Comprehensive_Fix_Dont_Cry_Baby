      - [ be32, 0x00000000, 0x7FA3EB78 ] # mr r3,r29 (original argument)
      - [ be32, 0x00000000, 0x3D800035 ] # lis r12,0x35
      - [ be32, 0x00000000, 0x618CD890 ] # ori r12,r12,0xd890
