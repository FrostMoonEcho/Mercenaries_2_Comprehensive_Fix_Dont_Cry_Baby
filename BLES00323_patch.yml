      - [ be32, 0x00000000, 0x419CFFDC ] # blt cr7,scan
      - [ be32, 0x00000000, 0x48000038 ] # b native_now (16 patch slots occupied)
      - [ be32, 0x00000000, 0x93AA0000 ] # stw r29,0(r10) (Human ID)
      - [ be32, 0x00000000, 0x3C0041F0 ] # lis r0,0x41f0 (30.0f)
      - [ be32, 0x00000000, 0x900A0004 ] # stw r0,4(r10) (seconds remaining)
