  "[Fix] Civilians Stay Dead":
    Games:
      "Mercenaries 2: World in Flames":
        BLES00323: [ 01.03 ]
    Author: "FrostMoonEcho"
    Patch Version: 0.1
    Group: ""
    Notes: |
      Civilians are not invincible anymore
    Patch:
      # _PedRoot_::FakeDead completion predicate. Preserve false returns; a
      # true return identifies the exact instant this pedestrian would recover.
      - [ calloc, 0x004F08B4, 88 ]
      - [ be32, 0x00000000, 0x78030620 ] # clrldi r3,r0,0x38 (original result)
      - [ be32, 0x00000000, 0x2F830000 ] # cmpwi cr7,r3,0
      - [ be32, 0x00000000, 0x419E0158 ] # beq cr7,return_hook (still FakeDead)
      - [ be32, 0x00000000, 0x815C0068 ] # lwz r10,0x68(r28) (pedestrian owner)
      - [ be32, 0x00000000, 0x800A0070 ] # lwz r0,0x70(r10) (Human ID)
      - [ be32, 0x00000000, 0x90010070 ] # stw r0,0x70(r1) (ID / Kill record)

      # Preserve the same script/HVT protection label used by the normal
      # corpse path before turning FakeDead into a real death.
      - [ be32, 0x00000000, 0x3D80002A ] # lis r12,0x002a
      - [ be32, 0x00000000, 0x618CCD68 ] # ori r12,r12,0xcd68
      - [ be32, 0x00000000, 0x7D8903A6 ] # mtctr r12
      - [ be32, 0x00000000, 0x4E800421 ] # bctrl (native label registry)
      - [ be32, 0x00000000, 0x78630020 ] # clrldi r3,r3,0x20
      - [ be32, 0x00000000, 0x80810070 ] # lwz r4,0x70(r1) (Human ID)
      - [ be32, 0x00000000, 0x7C8407B4 ] # extsw r4,r4
      - [ be32, 0x00000000, 0x3CA0FAF6 ] # lis r5,0xfaf6
      - [ be32, 0x00000000, 0x60A5DA61 ] # ori r5,r5,0xda61
      - [ be32, 0x00000000, 0x3D800031 ] # lis r12,0x0031
      - [ be32, 0x00000000, 0x618CFB10 ] # ori r12,r12,0xfb10
      - [ be32, 0x00000000, 0x7D8903A6 ] # mtctr r12
      - [ be32, 0x00000000, 0x4E800421 ] # bctrl (native HasLabel query)
      - [ be32, 0x00000000, 0x2F830000 ] # cmpwi cr7,r3,0
      - [ be32, 0x00000000, 0x409E010C ] # bne cr7,protected_return

      # Reproduce the native Entity.Kill producer's deferred 16-byte record.
      # Busy/full queues suppress recovery and are retried later.
      - [ be32, 0x00000000, 0x3D80011F ] # lis r12,0x011f (Kill queue root)
      - [ be32, 0x00000000, 0x618CC628 ] # ori r12,r12,0xc628
      - [ be32, 0x00000000, 0x896C5088 ] # lbz r11,0x5088(r12) (busy flag)
      - [ be32, 0x00000000, 0x2F8B0000 ] # cmpwi cr7,r11,0
      - [ be32, 0x00000000, 0x409E00F0 ] # bne cr7,busy_return
