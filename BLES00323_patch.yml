Version: 1.2

PPU-d02498a9cc5a1df4ade6373d79eab1cdd9e09229:
  "[Improvement] Clarity Everywhere":
    Games:
      "Mercenaries 2: World in Flames":
        BLES00323: [ 01.03 ]
    Author: "FrostMoonEcho"
    Patch Version: 0.7
    Group: ""
    Notes: |
      Forces the active gameplay-camera buffer's final focus vector to the exact
      five values used by the mounted Heavy MG: 2, 2, 600, 4, 0. This directly
      targets the nearby trees and vegetation that become sharp while using that
      weapon. It is a depth-of-field/focus fix, not a geometry draw-distance
      multiplier.

      Because this is a global final-buffer override, it can also affect scopes,
      cutscenes, the map, or other special camera modes. Disable this option
      first if one of those modes looks wrong.
    Patch:
      # Final camera double-buffer swap. r11 is the buffer that has just become
      # visible to the renderer; r10 is the next update buffer. Preserve the
      # overwritten final copy, then force the Heavy MG vector into both buffers.
      - [ calloc, 0x00238524, 15 ]
      - [ be32, 0x00000000, 0xD0AA0060 ] # stfs f5,0x60(r10) (original instruction)
      - [ be32, 0x00000000, 0x3C004000 ] # lis  r0,0x4000 (2.0f)
      - [ be32, 0x00000000, 0x900A004C ] # stw  r0,0x4c(r10)
      - [ be32, 0x00000000, 0x900B004C ] # stw  r0,0x4c(r11)
      - [ be32, 0x00000000, 0x900A0050 ] # stw  r0,0x50(r10)
      - [ be32, 0x00000000, 0x900B0050 ] # stw  r0,0x50(r11)
      - [ be32, 0x00000000, 0x3C004416 ] # lis  r0,0x4416 (600.0f)
      - [ be32, 0x00000000, 0x900A0054 ] # stw  r0,0x54(r10)
      - [ be32, 0x00000000, 0x900B0054 ] # stw  r0,0x54(r11)
      - [ be32, 0x00000000, 0x3C004080 ] # lis  r0,0x4080 (4.0f)
      - [ be32, 0x00000000, 0x900A0058 ] # stw  r0,0x58(r10)
      - [ be32, 0x00000000, 0x900B0058 ] # stw  r0,0x58(r11)
      - [ be32, 0x00000000, 0x38000000 ] # li   r0,0 (0.0f)
      - [ be32, 0x00000000, 0x900A005C ] # stw  r0,0x5c(r10)
      - [ be32, 0x00000000, 0x900B005C ] # stw  r0,0x5c(r11)

  "[Fix] Self-Shadowing Fix (Configurable)":
